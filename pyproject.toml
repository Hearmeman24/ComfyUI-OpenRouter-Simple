[project]
name = "comfyui-openrouter-simple"
description = "A bounded multimodal OpenRouter node for ComfyUI with text-only output."
version = "0.2.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<4",
    "numpy>=1.26",
    "Pillow>=10,<13",
]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Hearmeman24/ComfyUI-OpenRouter-Simple"
Documentation = "https://github.com/Hearmeman24/ComfyUI-OpenRouter-Simple#readme"
"Bug Tracker" = "https://github.com/Hearmeman24/ComfyUI-OpenRouter-Simple/issues"

[tool.comfy]
PublisherId = "hearmeman24"
DisplayName = "OpenRouter Simple"
Icon = ""
requires-comfyui = ">=0.32.0"
